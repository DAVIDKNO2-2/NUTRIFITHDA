<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>NutriFit - Planes de Alimentación</title>
  <link rel="stylesheet" href="/alimentacion/css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1 class="app-title">NutriFit 🥗</h1>
      <p class="tagline">Planes de alimentación personalizados para un estilo de vida saludable</p>
    </header>

    <section class="form-section">
      <h2>Crear nuevo plan</h2>
      <form id="formPlan">
        <input type="text" id="nombre" placeholder="Nombre del plan" required />
        <textarea id="descripcion" placeholder="Descripción"></textarea>
        <h2>Fecha Inicio</h2>
        <input type="date" id="fechaInicio" required />
        <h2>Fecha Final</h2>
        <input type="date" id="fechaFin" required />

        <h3>Agregar comidas:</h3>
        <div id="comidasContainer">
          <div class="comida">
            <select class="tipo">
              <option value="desayuno">Desayuno</option>
              <option value="almuerzo">Almuerzo</option>
              <option value="cena">Cena</option>
              <option value="snack">Snack</option>
            </select>
            <input type="time" class="hora" />
            <input type="text" class="descripcion" placeholder="Descripción de la comida" required />
          </div>
        </div>

        <button type="button" class="add-btn" onclick="agregarComida()">+ Comida</button>
        <button type="submit" class="submit-btn">Crear plan</button>
      </form>
    </section>

    <section class="planes-section">
      <h2>Planes existentes</h2>
      <ul id="listaPlanes"></ul>
    </section>
  </div>

  <script>
    const formPlan = document.getElementById('formPlan');
    const listaPlanes = document.getElementById('listaPlanes');
    const comidasContainer = document.getElementById('comidasContainer');

    const fetchPlanes = async () => {
        const response = await fetch('/api/alimentacion');
        const planes = await response.json();
        listaPlanes.innerHTML = '';
        planes.forEach(plan => {
            const li = document.createElement('li');
            li.innerHTML = `
                <h3>${plan.nombre}</h3>
                <p>${plan.descripcion}</p>
                <p>Del ${new Date(plan.fechaInicio).toLocaleDateString()} al ${new Date(plan.fechaFin).toLocaleDateString()}</p>
                <h4>Comidas:</h4>
                <ul>
                    ${plan.comidas.map(comida => `<li>${comida.tipo}: ${comida.descripcion} a las ${comida.hora}</li>`).join('')}
                </ul>
            `;
            listaPlanes.appendChild(li);
        });
    };

    const agregarComida = () => {
        const div = document.createElement('div');
        div.classList.add('comida');
        div.innerHTML = `
            <select class="tipo">
              <option value="desayuno">Desayuno</option>
              <option value="almuerzo">Almuerzo</option>
              <option value="cena">Cena</option>
              <option value="snack">Snack</option>
            </select>
            <input type="time" class="hora" />
            <input type="text" class="descripcion" placeholder="Descripción de la comida" required />
        `;
        comidasContainer.appendChild(div);
    };

    formPlan.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const descripcion = document.getElementById('descripcion').value;
        const fechaInicio = document.getElementById('fechaInicio').value;
        const fechaFin = document.getElementById('fechaFin').value;
        const comidasNodes = document.querySelectorAll('.comida');
        const comidas = [];
        comidasNodes.forEach(node => {
            comidas.push({
                tipo: node.querySelector('.tipo').value,
                hora: node.querySelector('.hora').value,
                descripcion: node.querySelector('.descripcion').value,
            });
        });

        const response = await fetch('/api/alimentacion', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                nombre,
                descripcion,
                fechaInicio: new Date(fechaInicio),
                fechaFin: new Date(fechaFin),
                comidas,
            }),
        });

        if (response.ok) {
            fetchPlanes();
            formPlan.reset();
        } else {
            const error = await response.json();
            alert(error.error);
        }
    });

    fetchPlanes();
  </script>
</body>
</html>
